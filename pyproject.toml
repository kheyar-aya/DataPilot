[project]
name = "datapilot"
version = "0.1.0"
description = "DataPilot — analyste de données IA multi-agents (LangGraph + function calling) qui répond en langage naturel sur un CSV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
